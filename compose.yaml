name: 9-ball-pool
services:
  game:
    image: 9-ball-pool:latest
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-11726}:8080"
    environment:
      SITE_URL: ${SITE_URL:-https://9ball.antfootage.net}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
