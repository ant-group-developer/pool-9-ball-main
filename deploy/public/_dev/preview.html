<!doctype html><html><head><base href="/9-ball-pool/"><meta charset="utf-8"><script src="ant-i18n.js"></script></head>
<body style="background:#3a4a66;margin:0;font:11px sans-serif;color:#fff"><div id=o style="display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start"></div>
<script>
(async()=>{await document.fonts.load('48px "Paytone One"','Ẫ');await document.fonts.load('300 48px "Josefin Sans"','Ẫ');
const names=await (await fetch('/_dev/names.json')).json();const only=location.hash.slice(1);
const load=n=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=names[n];});
const o=document.getElementById('o');const add=(c,label,scale)=>{const d=document.createElement('div');c.style.width=(c.width*(scale||1))+'px';c.style.background='rgba(0,0,0,.25)';d.appendChild(c);d.appendChild(document.createTextNode(label));o.appendChild(d);};
if(only==='rdy'){const fr=[];for(const n of Object.keys(names).filter(n=>/^rdygo\d+\.png$/.test(n)).sort())fr.push({name:n,img:await load(n)});const out=antI18n.buildReadyGo(fr);for(const f of fr)add(out[f.name],f.name,0.55);document.title='done';return;}
for(const n of Object.keys(antI18n.build)){if(only&&n!==only)continue;const img=await load(n);add(antI18n.build[n](img),n,only?1:(img.width>600?0.6:1));}
document.title='done';})();
</script></body></html>
