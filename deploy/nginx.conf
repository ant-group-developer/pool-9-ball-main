server {
    listen 8080;
    server_name _;
    # Keep redirects relative so the host proxy's HTTPS scheme and port are preserved.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # "/" is the game itself (full viewport, no landing chrome).
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header Content-Security-Policy "frame-ancestors 'self'" always; }
    location = /embed/ { return 308 /embed$is_args$args; }
    location = /embed {
        try_files /9-ball-pool/index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }
    location /9-ball-pool/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "public, max-age=3600" always;
    }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location ~ \.template\. { return 404; }
    location / { try_files $uri =404; }
}
